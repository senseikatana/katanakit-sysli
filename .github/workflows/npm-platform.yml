# Publica ksys en npm con binarios por plataforma.
#
# Cuando se ejecuta:
#   - Push de un tag `npm-v*` (ej. npm-v0.1.0) -> build + publish real.
#   - Manual (workflow_dispatch) o PR -> solo build + empaquetado (dry-run).
#
# Orden de publicación (importa):
#   1. Plataformas primero (@senseikatana/ksys-linux-x64, -arm64).
#   2. El wrapper `katanakit-sysli` después (depende de las anteriores).
#
# Requiere el secret NPM_TOKEN con acceso a tu cuenta y a la org @senseikatana.

name: npm-platform

on:
  push:
    tags:
      - "npm-v*"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "npm/**"
      - "npm-linux-*/**"
      - "scripts/sync-version.cjs"
  workflow_dispatch:

jobs:
  # 0. Las 3 versiones npm tienen que coincidir con Cargo.toml.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-version.cjs --check

  # 1. Compila el binario en cada plataforma y lo deja en npm-linux-*/bin/.
  build:
    needs: versions
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            pkgdir: npm-linux-x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            pkgdir: npm-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: mkdir -p ${{ matrix.pkgdir }}/bin
      - run: cp target/${{ matrix.target }}/release/ksys ${{ matrix.pkgdir }}/bin/ksys
      - run: chmod +x ${{ matrix.pkgdir }}/bin/ksys
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkgdir }}
          path: ${{ matrix.pkgdir }}/bin/ksys

  # 2. Publica: plataformas primero, wrapper después. Solo con tag npm-v*.
  # Modo Trusted Publisher (OIDC): SIN token. Requiere conectar el repo en
  # npmjs.com > cada paquete > Settings > Trusted Publishers (una sola vez).
  # El primer publish (paquetes inexistentes) se hace local con OTP manual.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/npm-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC para Trusted Publishers (sin NPM_TOKEN)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - run: |
          mkdir -p npm-linux-x64/bin npm-linux-arm64/bin
          cp _artifacts/npm-linux-x64/ksys npm-linux-x64/bin/ksys
          cp _artifacts/npm-linux-arm64/ksys npm-linux-arm64/bin/ksys
          chmod +x npm-linux-x64/bin/ksys npm-linux-arm64/bin/ksys
      - run: npm publish --provenance --access public ./npm-linux-x64
      - run: npm publish --provenance --access public ./npm-linux-arm64
      - run: npm publish --provenance --access public ./npm
